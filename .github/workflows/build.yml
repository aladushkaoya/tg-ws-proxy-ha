name: Build and publish

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: upstream-update
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for upstream update
        id: update
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          EVENT_NAME: ${{github.event_name}}
          RELEASE_TAG: ${{github.event.release.tag_name}}
        run: |
          set -euo pipefail
          
          DOCKERFILE="tg_ws_proxy/Dockerfile"
          CONFIG="tg_ws_proxy/config.yaml"
          
          # Release event: build an already prepared HA release.
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          
            CONFIG_VERSION=$(sed -nE \
              's/^version:[[:space:]]*"?([^"]+)"?.*$/\1/p' "$CONFIG")
          
            if [ "$CONFIG_VERSION" != "$VERSION" ]; then
              echo "Version mismatch!"
              exit 1
            fi
            
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Get the latest stable upstream release.
          UPSTREAM_TAG=$(gh api \
            repos/Flowseal/tg-ws-proxy/releases/latest \
            --jq '.tag_name')
          
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          
          # Validate upstream version.
          if [[ ! "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream version: $UPSTREAM_VERSION"
            exit 1
          fi
          
          CURRENT_VERSION=$(sed -nE \
            's/^ARG TG_WS_PROXY_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' "$DOCKERFILE")
          
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Could not read current upstream version!"
            exit 1
          fi
          
          echo "Current upstream: $CURRENT_VERSION"
          echo "Latest upstream:  $UPSTREAM_VERSION"
          
          if [ "$CURRENT_VERSION" = "$UPSTREAM_VERSION" ]; then
            echo "Already up to date!"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Update Dockerfile dependency version.
          sed -i -E \
          "s/^ARG TG_WS_PROXY_VERSION=.*/ARG TG_WS_PROXY_VERSION=${UPSTREAM_VERSION}/" \
          "$DOCKERFILE"
          
          # Increment HA add-on patch version.
          APP_VERSION=$(sed -nE \
          's/^version:[[:space:]]*"?([^"]+)"?.*$/\1/p' "$CONFIG")
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          
          NEW_APP_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          
          sed -i -E \
          "s/^version:.*/version: \"${NEW_APP_VERSION}\"/" \
          "$CONFIG"
          
          # Commit changes.
          git config user.name "github-actions[bot]"
          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "$DOCKERFILE" "$CONFIG"
          
          git commit -m "chore: update tg-ws-proxy to ${UPSTREAM_VERSION}"
          
          # Create HA add-on version tag.
          git tag "v${NEW_APP_VERSION}"
          
          # Push commit and tag.
          git push origin HEAD:refs/heads/master
          git push origin "v${NEW_APP_VERSION}"
          
          echo "version=$NEW_APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          
          echo "Updated HA add-on to $NEW_APP_VERSION"
          echo "Upstream version: $UPSTREAM_VERSION"

      - name: Set up QEMU
        if: steps.update.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.update.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.update.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.update.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./tg_ws_proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.update.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest